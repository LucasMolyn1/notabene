name: CI

on:
  push:
    branches: [main]
  pull_request:

# Moindre privilège : lecture seule par défaut pour tous les jobs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run coverage   # tests + seuils de couverture
      - run: npm run build
      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high

  # ESLint (sécurité et erreurs courantes) : dossier isolé tools/lint, car typescript-eslint ne supporte pas encore TypeScript 7.
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/lint/package-lock.json
      - run: npm run lint:install
      - run: npm run lint

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Navigateur téléchargé par Playwright (épinglé par la version du paquet dans package-lock.json).
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  docker:
    name: docker
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: notabene:ci
      # Vulnérabilités de l'image (système et dépendances) : échec sur HIGH/CRITICAL ayant un correctif.
      # Outil lancé depuis une image épinglée par digest (la politique du dépôt n'autorise que les actions GitHub ou vérifiées).
      - name: Trivy
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          ghcr.io/aquasecurity/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress notabene:ci

  # Déploiement isolé : l'application tourne sur un réseau Docker interne (aucune route vers l'extérieur), un parcours
  # complet s'exécute, et une sonde (scripts/isolated/egress-probe.cjs) prouve qu'aucune connexion ni résolution DNS
  # vers l'extérieur n'a été tentée.
  isole:
    name: isole
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: notabene:iso
      - name: Application sur un réseau sans sortie
        run: |
          set -euo pipefail
          docker network create --internal notabene-iso
          docker run -d --name nb --network notabene-iso --network-alias notabene \
            -e NODE_ENV=production -e ALLOW_INSECURE_HTTP=true -e PUBLIC_URL=http://notabene:3000 \
            -e ENCRYPTION_KEY="$(openssl rand -base64 32)" -e AUTH_LOCAL=true -e SEED_DEMO=false \
            -e NODE_OPTIONS="--require /probe/egress-probe.cjs" \
            -v "$PWD/scripts/isolated:/probe:ro" --read-only --tmpfs /tmp -v nb-data:/data notabene:iso
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' nb)" = healthy ] && break
            sleep 2
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' nb)" = healthy ] || { docker logs nb; exit 1; }
          docker exec -e NOTABENE_ADMIN_PASSWORD='Strong-iso-pass-123' nb node dist/server/cli.js create-admin admin@iso.test --name Admin
      - name: Parcours complet depuis le réseau interne
        run: |
          docker run --rm --network notabene-iso -v "$PWD/scripts/isolated:/s:ro" --entrypoint node notabene:iso \
            /s/smoke.mjs http://notabene:3000 admin@iso.test 'Strong-iso-pass-123'
      - name: Témoin positif (la sonde voit une tentative, le réseau n'a aucune sortie)
        run: |
          out=$(docker run --rm --network notabene-iso -e NODE_OPTIONS="--require /probe/egress-probe.cjs" \
            -v "$PWD/scripts/isolated:/probe:ro" --entrypoint node notabene:iso \
            -e "fetch('http://example.com').then(() => { console.log('SORTIE POSSIBLE'); process.exit(3); }, () => {})" 2>&1) || true
          echo "$out"
          echo "$out" | grep -q 'EGRESS-ATTEMPT' || { echo 'La sonde ne détecte pas une tentative de sortie.'; exit 1; }
          echo "$out" | grep -q 'SORTIE POSSIBLE' && { echo 'Le réseau de test laisse sortir du trafic.'; exit 1; }
          exit 0
      - name: Aucune tentative de sortie de l'application
        run: |
          docker logs nb > nb.log 2>&1
          if grep -E 'EGRESS-ATTEMPT|ENOTFOUND|EAI_AGAIN|ENETUNREACH' nb.log; then echo 'Tentative de connexion sortante détectée.'; exit 1; fi
          echo 'Aucune tentative de connexion sortante.'

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Recherche de secrets dans tout l'historique (image épinglée par digest).
      - name: Gitleaks
        run: >
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          detect --source /repo --redact --verbose --no-banner

  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # Analyse statique complémentaire à CodeQL (règles JavaScript, TypeScript, Node.js, OWASP Top 10).
      - run: python -m pip install semgrep==1.183.0
      - run: semgrep scan --config p/javascript --config p/typescript --config p/nodejs --config p/owasp-top-ten --metrics off --error --quiet server/src client/src

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
